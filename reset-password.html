<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Новый пароль — ATMO</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- fonts loaded via shared/styles.css @import -->
<link rel="stylesheet" href="shared/styles.css">
<style>
  body { background: var(--bg); }

  .auth-shell {
    min-height: 100vh;
    display: grid; grid-template-columns: 1fr;
  }
  @media (min-width: 920px) { .auth-shell { grid-template-columns: 1fr 1fr; } }

  .auth-form-side {
    padding: 32px 24px;
    display: flex; flex-direction: column;
    min-height: 100vh;
  }
  @media (min-width: 920px) { .auth-form-side { padding: 48px 64px; } }

  .brand-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 16px; margin-bottom: 56px;
  }
  .brand-mark {
    display: inline-flex; align-items: baseline; gap: 8px;
    text-decoration: none; color: var(--ink);
  }
  .brand-mark .dot {
    width: 10px; height: 10px; border-radius: 999px;
    background: var(--primary);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 22%, transparent);
  }
  .brand-mark .brand-name {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 24px; letter-spacing: -0.02em;
  }
  .brand-mark .brand-sub {
    font-family: 'Space Mono', monospace;
    font-size: 10px; color: var(--ink-mute);
    text-transform: uppercase; letter-spacing: 0.14em;
  }
  .back-home {
    font-size: 13px; color: var(--ink-soft); text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .back-home:hover { color: var(--ink); }

  .auth-card {
    width: 100%; max-width: 420px; margin: auto;
  }
  .auth-card h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(34px, 4.5vw, 44px);
    line-height: 1.05; letter-spacing: -0.02em;
    margin: 0 0 14px; text-wrap: balance;
  }
  .auth-card h1 em { font-style: italic; color: var(--primary-deep); }
  .auth-card .lead {
    color: var(--ink-soft); font-size: 16px; line-height: 1.55;
    margin: 0 0 32px;
  }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field label {
    font-size: 13px; color: var(--ink-soft); font-weight: 500;
  }
  .field input {
    padding: 13px 14px; border-radius: 10px;
    border: 1px solid var(--line-strong);
    background: var(--bg-card);
    font-family: inherit; font-size: 15px; color: var(--ink);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);
  }
  .field .pw-wrap { position: relative; }
  .field .pw-wrap input { width: 100%; padding-right: 56px; box-sizing: border-box; }
  .field .pw-toggle {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: transparent; border: none; cursor: pointer;
    font-family: 'Space Mono', monospace; font-size: 11px;
    color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.1em;
    padding: 6px 10px; border-radius: 6px;
  }
  .field .pw-toggle:hover { color: var(--ink); background: var(--bg-warm); }

  .strength {
    height: 4px; border-radius: 999px;
    background: var(--bg-warm); margin-top: 8px; overflow: hidden;
  }
  .strength span {
    display: block; height: 100%; width: 0;
    transition: width .25s ease, background .25s ease;
  }
  .strength span.weak   { background: #c25a4a; width: 33%; }
  .strength span.medium { background: #cdb38a; width: 66%; }
  .strength span.strong { background: var(--positive); width: 100%; }
  .strength-lbl {
    font-size: 11px; color: var(--ink-mute); margin-top: 6px;
    font-family: 'Space Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase;
  }

  .match-hint {
    font-size: 12px; margin-top: 6px;
    font-family: 'Space Mono', monospace; letter-spacing: 0.08em;
    display: none;
  }
  .match-hint.ok  { color: var(--positive); display: block; }
  .match-hint.err { color: #c25a4a; display: block; }

  .submit {
    background: var(--ink); color: var(--bg);
    padding: 15px 28px; border: none; border-radius: 999px;
    font-family: inherit; font-weight: 600; font-size: 15px;
    cursor: pointer; width: 100%; margin-top: 8px;
    transition: background .15s ease, transform .15s ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .submit:hover { background: #000; transform: translateY(-1px); }
  .submit:disabled { background: var(--line-strong); cursor: not-allowed; transform: none; }
  .submit.loading::after {
    content: ""; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
    border-radius: 999px; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .success-state {
    display: none; text-align: center; padding: 32px 0;
  }
  .success-state .check {
    width: 72px; height: 72px; border-radius: 999px;
    background: color-mix(in srgb, var(--primary) 18%, transparent);
    color: var(--primary-deep);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 32px; margin-bottom: 20px;
    animation: pop .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  .success-state h2 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 32px; letter-spacing: -0.02em; margin: 0 0 10px;
  }
  .success-state p { color: var(--ink-soft); line-height: 1.55; margin: 0 0 28px; }
  @keyframes pop {
    0%   { transform: scale(0.4); opacity: 0; }
    100% { transform: scale(1);   opacity: 1; }
  }

  /* Right visual */
  .auth-visual-side {
    display: none;
    background:
      repeating-linear-gradient(135deg, rgba(26,26,31,0.04) 0 1px, transparent 1px 14px),
      color-mix(in srgb, var(--primary) 14%, var(--bg-warm));
    position: relative; overflow: hidden;
  }
  @media (min-width: 920px) {
    .auth-visual-side { display: flex; align-items: flex-end; padding: 56px; }
  }
  .auth-visual-side blockquote {
    margin: 0;
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(28px, 3vw, 38px); line-height: 1.15;
    letter-spacing: -0.01em; color: var(--ink);
    max-width: 480px; text-wrap: balance; position: relative; z-index: 2;
  }
  .auth-visual-side cite {
    display: block; margin-top: 22px; font-style: normal;
    font-family: 'Space Mono', monospace;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--ink-soft);
  }

  @media (max-width: 640px) {
    .auth-form-side { padding: 24px 20px; min-height: 100svh; }
    .brand-row { margin-bottom: 32px; }
    .auth-card h1 { font-size: 32px; }
  }
</style>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-form-side">
      <div class="brand-row">
        <a class="brand-mark" href="index.html">
          <span class="dot"></span>
          <span class="brand-name">atmo</span>
          <span class="brand-sub">studio</span>
        </a>
        <a class="back-home" href="auth.html">← Ко входу</a>
      </div>

      <div class="auth-card">

        <!-- Form state -->
        <div id="form-state">
          <h1>Новый <em>пароль</em>.</h1>
          <p class="lead">Придумайте надёжный пароль — и снова в деле.</p>

          <form id="reset-form">
            <div class="field">
              <label for="pw-new">Новый пароль</label>
              <div class="pw-wrap">
                <input id="pw-new" type="password" required
                  autocomplete="new-password" placeholder="Минимум 8 символов" />
                <button type="button" class="pw-toggle" data-pw="pw-new">показать</button>
              </div>
              <div class="strength"><span id="strength-bar"></span></div>
              <div class="strength-lbl" id="strength-lbl"></div>
            </div>

            <div class="field">
              <label for="pw-confirm">Повторите пароль</label>
              <div class="pw-wrap">
                <input id="pw-confirm" type="password" required
                  autocomplete="new-password" placeholder="Повторите пароль" />
                <button type="button" class="pw-toggle" data-pw="pw-confirm">показать</button>
              </div>
              <div class="match-hint" id="match-hint"></div>
            </div>

            <button type="submit" class="submit" id="submit-btn" disabled>
              Сохранить пароль
            </button>
          </form>
        </div>

        <!-- Success state -->
        <div class="success-state" id="success-state">
          <div class="check">✓</div>
          <h2>Пароль обновлён.</h2>
          <p>Теперь входите с новым паролем — всё сохранено.</p>
          <a href="auth.html" class="submit" style="text-decoration:none;display:inline-flex">
            Войти в аккаунт →
          </a>
        </div>

      </div>
    </div>

    <div class="auth-visual-side">
      <blockquote>
        «Хороший пароль — как хорошая привычка: один раз поставила, и больше не думаешь.»
        <cite>— ATMO Studio</cite>
      </blockquote>
    </div>
  </div>

  <script>
    // Password toggle
    document.querySelectorAll('.pw-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const inp = document.getElementById(btn.dataset.pw);
        const shown = inp.type === 'text';
        inp.type = shown ? 'password' : 'text';
        btn.textContent = shown ? 'показать' : 'скрыть';
      });
    });

    // Strength meter
    const pwNew     = document.getElementById('pw-new');
    const pwConfirm = document.getElementById('pw-confirm');
    const bar       = document.getElementById('strength-bar');
    const lbl       = document.getElementById('strength-lbl');
    const matchHint = document.getElementById('match-hint');
    const submitBtn = document.getElementById('submit-btn');

    function calcStrength(v) {
      if (v.length < 8) return 0;       // hard minimum 8 chars
      let s = 1;                         // base point for reaching 8+
      if (/[A-Z]/.test(v) || /[а-яА-Я]/.test(v)) s++;
      if (/[0-9]/.test(v)) s++;
      if (/[^a-zA-Zа-яА-Я0-9]/.test(v)) s++;
      return Math.min(s, 3);
    }

    function updateState() {
      const v = pwNew.value;
      const s = calcStrength(v);
      const tooShort = v.length > 0 && v.length < 8;
      bar.className = tooShort ? 'weak' : s === 1 ? 'weak' : s === 2 ? 'medium' : s >= 3 ? 'strong' : '';
      lbl.textContent = v.length === 0 ? '' : tooShort ? 'Минимум 8 символов' : s === 1 ? 'Слабый' : s === 2 ? 'Средний' : 'Надёжный';

      const match = pwConfirm.value && pwNew.value === pwConfirm.value;
      const mismatch = pwConfirm.value && pwNew.value !== pwConfirm.value;
      matchHint.className = 'match-hint' + (match ? ' ok' : mismatch ? ' err' : '');
      matchHint.textContent = match ? '✓ Пароли совпадают' : mismatch ? '✗ Пароли не совпадают' : '';

      submitBtn.disabled = !(v.length >= 8 && s >= 1 && match);
    }

    pwNew.addEventListener('input', updateState);
    pwConfirm.addEventListener('input', updateState);

    // Submit
    document.getElementById('reset-form').addEventListener('submit', e => {
      e.preventDefault();
      submitBtn.classList.add('loading');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Сохраняем ';
      setTimeout(() => {
        document.getElementById('form-state').style.display = 'none';
        document.getElementById('success-state').style.display = 'block';
      }, 900);
    });
  </script>
</body>
</html>
