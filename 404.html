<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Страница не найдена — ATMO</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- fonts loaded via shared/styles.css @import -->
<link rel="stylesheet" href="shared/styles.css">
<style>
  body { background: var(--bg-warm); }

  .notfound-wrap {
    min-height: calc(100vh - 160px);
    display: flex; align-items: center; justify-content: center;
    padding: 60px 24px;
  }

  .notfound-inner {
    text-align: center;
    max-width: 520px;
  }

  .notfound-visual {
    position: relative;
    display: inline-flex;
    align-items: center; justify-content: center;
    margin-bottom: 40px;
  }

  .notfound-num {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-size: clamp(120px, 22vw, 200px);
    line-height: 1;
    letter-spacing: -0.04em;
    color: transparent;
    -webkit-text-stroke: 2px var(--line-strong);
    user-select: none;
    position: relative;
    z-index: 1;
  }

  .notfound-blob {
    position: absolute;
    width: 200px; height: 200px;
    background: radial-gradient(ellipse at center,
      color-mix(in srgb, var(--primary) 18%, transparent) 0%,
      transparent 70%);
    border-radius: 999px;
    pointer-events: none;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  .notfound-eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--primary-deep);
    margin-bottom: 14px;
    display: block;
  }

  .notfound-inner h1 {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 40px);
    letter-spacing: -0.02em;
    margin: 0 0 16px;
    line-height: 1.1;
  }

  .notfound-inner p {
    font-size: 16px; line-height: 1.65;
    color: var(--ink-soft);
    margin: 0 0 36px;
  }

  .notfound-actions {
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
  }
</style>
</head>
<body>
  <div id="nav-root"></div>

  <main class="notfound-wrap">
    <div class="notfound-inner">

      <div class="notfound-visual">
        <div class="notfound-blob"></div>
        <span class="notfound-num">404</span>
      </div>

      <span class="notfound-eyebrow">Страница не найдена</span>
      <h1>Кажется, здесь ничего нет</h1>
      <p>Страница могла переехать или её никогда не существовало.<br>
         Но ваши курсы и прогресс — никуда не делись.</p>

      <div class="notfound-actions">
        <a href="catalog.html" class="btn btn-primary btn-lg">В каталог курсов</a>
        <a href="account.html" class="btn btn-soft btn-lg">Мой кабинет</a>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script src="shared/data.js"></script>
  <script src="shared/layout.js"></script>
  <script>
    ATMO.renderShell({ active: '' });
  </script>
</body>
</html>
